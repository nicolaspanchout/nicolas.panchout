<style>
:root {
  /* Chambre de nuit photoréaliste : bruns profonds, lumière orange de lampe, crème. Single-theme volontaire. */
  --night: #0f0a07;
  --ink: #f6ead9;
  --muted: #bda98f;
  --glow: #ff8a3d;
  --amber: #ffc27a;
  --glass: rgba(22, 14, 9, .8);
  --line: rgba(255, 200, 150, .16);
  --f-display: "Syne", "Arial Black", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }

/* ---------- Scène ---------- */
.viewport { position: fixed; inset: 0; overflow: hidden; }
.scene { position: absolute; inset: 0; transform-origin: 0 0; transition: transform 1.1s cubic-bezier(.7, 0, .2, 1); }
.parallax { position: absolute; inset: -1%; transition: transform .2s linear; }
.stage {
  position: absolute; left: 50%; top: 50%;
  width: max(100%, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9;
  transform: translate(-50%, -50%);
}
.stage img.room { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
.lit {
  position: absolute; inset: 0; background: url("chambre.jpg") center / 100% 100% no-repeat;
  filter: brightness(1.35) saturate(1.12); opacity: 0; transition: opacity .35s ease; pointer-events: none;
}
.lit.on { opacity: 1; }
.hot-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.hot { fill: transparent; stroke: transparent; cursor: pointer; outline: none; transition: stroke .3s, fill .3s; vector-effect: non-scaling-stroke; stroke-width: 1.5; }
.hot.on { stroke: rgba(255, 196, 140, .85); fill: rgba(255, 150, 70, .06); }
.hot:focus-visible { stroke: var(--amber); stroke-width: 2.5; }

.pin { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; }
.pin::before, .pin::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
.pin::before { background: var(--amber); box-shadow: 0 0 12px var(--glow); transform: scale(.55); }
.pin::after { border: 2px solid var(--amber); animation: ring 2.4s ease-out infinite; }
@keyframes ring { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
body.zoomed .pin, body.zoomed #dust { opacity: 0; transition: opacity .3s; }

#dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
.dark { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .9s ease;
  background: radial-gradient(26% 32% at 50% 58%, rgba(10, 6, 4, .1), rgba(10, 6, 4, .78) 70%); }
body.lights-off .dark { opacity: 1; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(8, 5, 3, .55)); }

/* ---------- HUD ---------- */
.hud { position: fixed; z-index: 5; pointer-events: none; transition: opacity .3s; }
.hud > * { pointer-events: auto; }
.brand { top: 22px; left: 24px; text-shadow: 0 2px 18px rgba(0, 0, 0, .6); }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: -.02em; margin: 0; line-height: 1; }
.brand p { margin: 6px 0 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hint { top: 26px; right: 24px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 999px; background: rgba(15, 10, 7, .45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.hint i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--glow); }
body.zoomed .hint, body.zoomed .brand { opacity: 0; }

.dock { left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: calc(100% - 32px); overflow-x: auto; scrollbar-width: none; }
.dock::-webkit-scrollbar { display: none; }
.dock button { font: 600 12px/1 var(--f-body); color: var(--muted); background: transparent; border: 0; padding: 10px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: color .2s, background .2s; }
.dock button:hover, .dock button.on { color: var(--ink); background: rgba(255, 138, 61, .22); }
.dock button:focus-visible, .panel button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
body.zoomed .dock { opacity: 0; pointer-events: none; }

.tip { position: fixed; z-index: 6; pointer-events: none; padding: 7px 11px; border-radius: 8px; background: var(--ink); color: var(--night); font: 600 12px/1.2 var(--f-body); white-space: nowrap; opacity: 0; transform: translate(-50%, -150%); transition: opacity .15s; }
.tip small { display: block; font: 400 10px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.tip.show { opacity: 1; }

/* ---------- Panneau ---------- */
.panel { position: fixed; z-index: 10; top: 0; right: 0; height: 100%; width: min(560px, 46vw); background: var(--glass); backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2); border-left: 1px solid var(--line); transform: translateX(105%); transition: transform .8s cubic-bezier(.7, 0, .2, 1); display: flex; flex-direction: column; }
body.zoomed .panel { transform: none; transition-delay: .3s; }
.panel-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.crumb { font: 400 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.crumb b { color: var(--amber); font-weight: 600; }
.btn { font: 600 12px/1 var(--f-body); color: var(--ink); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); padding: 10px 14px; border-radius: 999px; cursor: pointer; transition: background .2s; }
.btn:hover { background: rgba(255, 255, 255, .14); }
.panel-body { overflow-y: auto; padding: 32px 28px 40px; flex: 1; overscroll-behavior: contain; }
.panel h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 3.4vw, 46px); line-height: 1; letter-spacing: -.03em; margin: 0 0 14px; text-wrap: balance; }
.panel .intro { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 0 30px; max-width: 62ch; }
.cards { display: grid; gap: 28px; }
.card { display: grid; gap: 12px; }
.thumb { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); display: grid; place-items: center;
  background: radial-gradient(110% 80% at 25% 15%, rgba(255, 138, 61, .45), transparent 60%), radial-gradient(90% 80% at 90% 100%, rgba(255, 194, 122, .18), transparent 60%), #1c130d; }
.thumb::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 28px 28px; mask-image: radial-gradient(circle at center, #000 30%, transparent 80%); -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 80%); }
.thumb span { position: relative; z-index: 1; font: 600 10px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); background: rgba(15, 10, 7, .6); border: 1px dashed rgba(255, 255, 255, .3); padding: 8px 10px; border-radius: 6px; }
.thumb.portrait { aspect-ratio: 9 / 16; width: min(100%, 292px); }
.thumb.land { aspect-ratio: 4 / 3; }
.card h3 { font-family: var(--f-display); font-weight: 700; font-size: 21px; margin: 4px 0 0; letter-spacing: -.01em; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta span { font: 400 10.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 6px 8px; border-radius: 999px; }
.meta span.status { color: var(--night); background: var(--amber); border-color: var(--amber); font-weight: 600; }
.card p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 14.5px; max-width: 62ch; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.stats b { display: block; font: 700 20px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stats small { display: block; margin-top: 6px; font: 400 10px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.list { display: grid; margin: 0 0 28px; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.list li { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.list li span:last-child { color: var(--muted); font: 400 12px/1.5 var(--f-mono); text-align: right; }
.label { font: 400 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--amber); margin: 0 0 12px; }
.contact-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
.contact-line div { display: grid; gap: 4px; min-width: 0; }
.contact-line small { font: 400 10.5px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.contact-line strong { font: 700 18px/1.2 var(--f-display); overflow-wrap: anywhere; }
.todo { display: inline-block; margin-left: 6px; font: 600 9.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--night); background: var(--amber); padding: 4px 6px; border-radius: 4px; vertical-align: middle; }
.panel-foot { display: flex; justify-content: space-between; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line); }

/* ---------- Mobile : on balaie la chambre ---------- */
@media (max-aspect-ratio: 5/4) {
  .viewport { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .viewport::-webkit-scrollbar { display: none; }
  .scene { position: relative; height: 100%; width: calc(100vh * 16 / 9); transition: none; }
  .parallax { inset: 0; }
  .stage { left: 0; top: 0; width: 100%; height: 100%; transform: none; }
  .hint { display: none; }
  .panel { width: 100%; height: 78%; top: auto; bottom: 0; border-left: 0; border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; transform: translateY(105%); }
}
@media (max-width: 520px) { .brand h1 { font-size: 24px; } .panel-body { padding: 26px 20px 32px; } .stats b { font-size: 17px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }

.thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
.thumb.has-media { cursor: zoom-in; }
.thumb.has-media::after { display: none; }
.thumb .count { position: absolute; z-index: 3; right: 10px; bottom: 10px; font: 600 10px/1 var(--f-mono); letter-spacing: .1em; color: var(--ink); background: rgba(15, 10, 7, .7); padding: 6px 8px; border-radius: 999px; border: 0; }
.thumb .play { position: absolute; z-index: 3; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(15, 10, 7, .65); border: 1px solid rgba(255, 255, 255, .35); padding: 0; }
.thumb .play::before { content: ""; position: absolute; left: 21px; top: 16px; border-left: 17px solid var(--ink); border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.card-link { justify-self: start; text-decoration: none; }
.lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(8, 5, 3, .94); display: none; align-items: center; justify-content: center; padding: 56px 16px 72px; }
.lightbox.open { display: flex; }
.lightbox .media { max-width: 100%; max-height: 100%; display: grid; place-items: center; }
.lightbox .media img, .lightbox .media video { max-width: min(1400px, 100%); max-height: calc(100vh - 140px); border-radius: 10px; display: block; }
.lb-top { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font: 400 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.lb-nav { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
</style>
</head>

  contact: { object: "Le baladeur", nav: "Contact",
    title: "On travaille ensemble ?",
    intro: "Un logo, des reels pour ton commerce, une maquette d'appli ou un visuel 3D : écris-moi et on en parle." }
};
const ORDER = ["identite", "uxui", "3d", "photo", "video", "about", "contact"];

/* ---------- Construction des zones ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hots = $("#hots"), lits = $("#lits"), pins = $("#pins");
const NS = "http://www.w3.org/2000/svg";
Object.entries(HULLS).forEach(([key, pts]) => {
  const poly = document.createElementNS(NS, "polygon");
  poly.setAttribute("points", pts.map(p => p.join(",")).join(" "));
  poly.setAttribute("class", "hot"); poly.dataset.key = key;
  poly.setAttribute("tabindex", "0"); poly.setAttribute("role", "button");
  poly.setAttribute("aria-label", key === "lamp" ? "Applique murale : allumer ou éteindre" : `${SECTIONS[key].object} : ${SECTIONS[key].nav}`);
  hots.appendChild(poly);
  const lit = document.createElement("div");
  lit.className = "lit"; lit.dataset.key = key;
  lit.style.clipPath = `polygon(${pts.map(([x, y]) => `${x}% ${y}%`).join(",")})`;
  lits.appendChild(lit);
  if (key !== "lamp") {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const pin = document.createElement("span"); pin.className = "pin";
    pin.style.left = Math.max(...xs) + "%"; pin.style.top = Math.max(4, Math.min(...ys) + 1) + "%";
    pins.appendChild(pin);
  }
});

/* ---------- Panneau ---------- */
function mediaList(p) {
  const list = (p.images || []).map(src => ({ type: "image", src }));
  if (p.video) list.unshift({ type: "video", src: p.video, poster: (p.images || [])[0] });
  return list;
}
function renderProjects(sec, key) {
  return `<div class="cards">${sec.projects.map((p, i) => {
    const media = mediaList(p), first = media[0];
    let thumb = `<span>Visuel à intégrer</span>`;
    if (first && first.type === "image") thumb = `<img src="${esc(first.src)}" alt="${esc(p.title)}" loading="lazy">`;
    if (first && first.type === "video") thumb = first.poster
      ? `<img src="${esc(first.poster)}" alt="${esc(p.title)}" loading="lazy"><span class="play" aria-hidden="true"></span>`
      : `<video src="${esc(first.src)}#t=0.5" muted playsinline preload="metadata"></video><span class="play" aria-hidden="true"></span>`;
    const count = media.length > 1 ? `<span class="count">${media.length} visuels</span>` : "";
    const open = media.length ? ` has-media" role="button" tabindex="0" data-lb="${key}:${i}" aria-label="Voir ${esc(p.title)} en grand` : "";
    return `
    <article class="card">
      <div class="thumb ${p.ratio}${open}">${thumb}${count}</div>
      <div class="meta">${p.status ? `<span class="status">${esc(p.status)}</span>` : ""}${(p.meta || []).map(m => `<span>${esc(m)}</span>`).join("")}</div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.text || "")}</p>
      ${p.stats && p.stats.length ? `<div class="stats">${p.stats.map(([v, l]) => `<div><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join("")}</div>` : ""}
      ${p.link ? `<a class="btn card-link" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.linkLabel || "Voir le projet")} ↗</a>` : ""}
    </article>`; }).join("")}</div>`;
}
const renderAbout = () => `
  <p class="label">Ce que je fais</p>
  <ul class="list">
    <li><span>Identité visuelle</span><span>logos · chartes</span></li>
    <li><span>UX/UI</span><span>applis · sites</span></li>
    <li><span>Vidéo réseaux sociaux</span><span>reels · stories</span></li>
    <li><span>3D</span><span>illustrations · rendus</span></li>
    <li><span>Photo</span><span>shootings</span></li>
  </ul>
  <p class="label">Dans mon sac</p>
  <ul class="list">
    <li><span>Blender</span><span>3D</span></li>
    <li><span>DJI Osmo Pocket 3</span><span>vidéo</span></li>
  </ul>`;
let CONTACT = { email: "ton.email@exemple.fr", instagram: "@ton_compte", instagram_url: "", zone: "Île-de-France · à distance" };
const todo = v => /exemple|ton_compte/.test(v) ? `<span class="todo">à compléter</span>` : "";
const renderContact = () => `
  <div class="contact-line"><div><small>Email</small><strong>${esc(CONTACT.email)}${todo(CONTACT.email)}</strong></div><button class="btn" type="button" data-copy="${esc(CONTACT.email)}">Copier</button></div>
  <div class="contact-line"><div><small>Instagram</small><strong>${esc(CONTACT.instagram)}${todo(CONTACT.instagram)}</strong></div>${CONTACT.instagram_url ? `<a class="btn" href="${esc(CONTACT.instagram_url)}" target="_blank" rel="noopener">Ouvrir ↗</a>` : ""}</div>
  <div class="contact-line"><div><small>Zone</small><strong>${esc(CONTACT.zone)}</strong></div></div>`;

let current = null;
const panel = $("#panel"), scene = $("#scene"), viewport = $("#viewport"), tip = $("#tip");
const isScroll = () => matchMedia("(max-aspect-ratio: 5/4)").matches;
const polyOf = k => hots.querySelector(`[data-key="${k}"]`);
const litOf = k => lits.querySelector(`[data-key="${k}"]`);

function zoomTo(el) {
  scene.style.transform = "";
  if (isScroll()) return;
  const r = el.getBoundingClientRect();
  const vw = innerWidth, vh = innerHeight, free = vw - panel.offsetWidth;
  const s = Math.max(1.25, Math.min(1.7, (free * .5) / r.width, (vh * .55) / r.height));
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  scene.style.transform = `translate(${free / 2 - cx * s}px, ${vh / 2 - cy * s}px) scale(${s})`;
}
function highlight(k, on) { const p = polyOf(k), l = litOf(k); if (p) p.classList.toggle("on", on); if (l) l.classList.toggle("on", on); }

function open(key, fromHash) {
  const sec = SECTIONS[key]; if (!sec) return;
  if (current) highlight(current, false);
  current = key; highlight(key, true); tip.classList.remove("show");
  $("#p-crumb").innerHTML = `<b>${esc(sec.object)}</b> · ${String(ORDER.indexOf(key) + 1).padStart(2, "0")}/${String(ORDER.length).padStart(2, "0")}`;
  $("#p-body").innerHTML = `<h2 id="p-title">${esc(sec.title)}</h2><p class="intro">${esc(sec.intro)}</p>` +
    (key === "about" ? renderAbout() : key === "contact" ? renderContact() : renderProjects(sec, key));
  $("#p-body").scrollTop = 0;
  document.body.classList.add("zoomed"); panel.setAttribute("aria-hidden", "false");
  mx = my = 0; $("#parallax").style.transform = "";
  zoomTo(polyOf(key));
  document.querySelectorAll("#dock button").forEach(b => b.classList.toggle("on", b.dataset.k === key));
  if (isScroll()) { const r = polyOf(key).getBoundingClientRect(); viewport.scrollBy({ left: r.left + r.width / 2 - innerWidth / 2, behavior: "smooth" }); }
  if (!fromHash && location.hash !== "#" + key) history.replaceState(null, "", "#" + key);
  setTimeout(() => $("#p-close").focus({ preventScroll: true }), 60);
}
function close() {
  if (!current) return;
  highlight(current, false);
  const k = current; current = null;
  document.body.classList.remove("zoomed"); panel.setAttribute("aria-hidden", "true");
  scene.style.transform = "";
  document.querySelectorAll("#dock button").forEach(b => b.classList.remove("on"));
  history.replaceState(null, "", location.pathname + location.search);
  polyOf(k).focus({ preventScroll: true });
}
const step = d => open(ORDER[(ORDER.indexOf(current) + d + ORDER.length) % ORDER.length]);

/* ---------- Interactions ---------- */
$("#dock").innerHTML = ORDER.map(k => `<button type="button" data-k="${k}">${esc(SECTIONS[k].nav)}</button>`).join("");
$("#dock").addEventListener("click", e => { const b = e.target.closest("button"); if (b) open(b.dataset.k); });

function act(k) { if (k === "lamp") document.body.classList.toggle("lights-off"); else open(k); }
hots.querySelectorAll(".hot").forEach(p => {
  const k = p.dataset.key;
  p.addEventListener("click", e => { e.stopPropagation(); act(k); });
  p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(k); } });
  p.addEventListener("mouseenter", () => {
    if (current) return;
    highlight(k, true);
    tip.innerHTML = k === "lamp" ? `<small>L'applique</small>Allumer / éteindre` : `<small>${esc(SECTIONS[k].object)}</small>${esc(SECTIONS[k].nav)}`;
    tip.classList.add("show");
  });
  p.addEventListener("mouseleave", () => { if (current !== k) highlight(k, false); tip.classList.remove("show"); });
  p.addEventListener("focus", () => { if (!current) highlight(k, true); });
  p.addEventListener("blur", () => { if (current !== k) highlight(k, false); });
});
addEventListener("mousemove", e => { tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; });
$("#p-close").addEventListener("click", close);
$("#p-prev").addEventListener("click", () => step(-1));
$("#p-next").addEventListener("click", () => step(1));
$("#p-body").addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copié"; } catch { b.textContent = "Sélectionne le texte"; }
  setTimeout(() => (b.textContent = "Copier"), 1800);
});
addEventListener("keydown", e => {
  if (!current) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});
viewport.addEventListener("click", () => { if (current && !isScroll()) close(); });
addEventListener("resize", () => { if (current) zoomTo(polyOf(current)); sizeDust(); });

/* ---------- Parallaxe douce ---------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let mx = 0, my = 0, px = 0, py = 0;
if (!reduce) {
  addEventListener("mousemove", e => { if (!current && !isScroll()) { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; } });
  (function loop() {
    px += (mx - px) * .05; py += (my - py) * .05;
    if (!current) $("#parallax").style.transform = `translate(${(-px * 18).toFixed(2)}px, ${(-py * 12).toFixed(2)}px)`;
    requestAnimationFrame(loop);
  })();
}

/* ---------- Poussière dans la lumière ---------- */
const cv = $("#dust"), ctx = cv.getContext("2d");
let motes = [];
function sizeDust() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  motes = Array.from({ length: 70 }, () => ({
    x: (.32 + Math.random() * .36) * r.width, y: (.15 + Math.random() * .6) * r.height,
    r: .5 + Math.random() * 1.4, vx: (Math.random() - .5) * .12, vy: -.05 - Math.random() * .12, a: Math.random() * Math.PI * 2
  }));
}
sizeDust();
if (!reduce) (function dust() {
  const w = cv.width / (Math.min(devicePixelRatio || 1, 2)), h = cv.height / (Math.min(devicePixelRatio || 1, 2));
  ctx.clearRect(0, 0, w, h);
  for (const m of motes) {
    m.a += .01; m.x += m.vx + Math.sin(m.a) * .08; m.y += m.vy;
    if (m.y < h * .1) { m.y = h * .78; m.x = (.32 + Math.random() * .36) * w; }
    const fade = Math.sin((m.y / h - .1) / .68 * Math.PI);
    ctx.globalAlpha = .35 * fade; ctx.fillStyle = "#ffd3a0";
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(dust);
})();

/* ---------- Projets chargés depuis projets.json ---------- */
function applyData(d) {
  if (d.contact) CONTACT = Object.assign(CONTACT, d.contact);
  const P = d.projets || {};
  const ALIAS = { "3d": "3d", "photos": "photo", "videos": "video", "ux-ui-design": "uxui", "logos": "identite" };
  for (const name of Object.keys(P)) {
    const k = ALIAS[name] || name;
    if (!SECTIONS[k] || !Array.isArray(P[name])) continue;
    SECTIONS[k].projects = P[name].map(p => ({
      title: p.titre || "Sans titre", meta: p.tags || [], text: p.texte || "",
      ratio: (p.format || "").startsWith("portrait") ? "portrait" : "land",
      images: p.images || [], video: p.video || "", link: p.lien || "", linkLabel: p.texte_lien || "",
      status: p.statut || "", stats: (p.stats || []).map(x => Array.isArray(x) ? x : [x.chiffre, x.label])
    }));
  }
  if (current) { const k = current; current = null; open(k, true); }
}
fetch("projets.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(d => d && applyData(d)).catch(() => {});

/* ---------- Visionneuse ---------- */
const lb = $("#lightbox"), lbMedia = $("#lb-media");
let lbList = [], lbIdx = 0, lbReturn = null;
function lbShow() {
  const m = lbList[lbIdx];
  lbMedia.innerHTML = m.type === "video"
    ? `<video src="${esc(m.src)}" controls autoplay playsinline ${m.poster ? `poster="${esc(m.poster)}"` : ""}></video>`
    : `<img src="${esc(m.src)}" alt="">`;
  $("#lb-count").textContent = `${lbIdx + 1} / ${lbList.length}`;
  $("#lb-prev").style.visibility = $("#lb-next").style.visibility = $("#lb-count").style.visibility = lbList.length > 1 ? "visible" : "hidden";
}
function lbOpen(key, i, from) {
  const p = SECTIONS[key].projects[i]; lbList = mediaList(p); if (!lbList.length) return;
  lbIdx = 0; lbReturn = from; $("#lb-title").textContent = p.title; lb.classList.add("open"); lbShow(); $("#lb-close").focus();
}
function lbClose() { lb.classList.remove("open"); lbMedia.innerHTML = ""; if (lbReturn) lbReturn.focus(); }
$("#p-body").addEventListener("click", e => { const t = e.target.closest("[data-lb]"); if (t) { const [k, i] = t.dataset.lb.split(":"); lbOpen(k, +i, t); } });
$("#p-body").addEventListener("keydown", e => { const t = e.target.closest("[data-lb]"); if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); const [k, i] = t.dataset.lb.split(":"); lbOpen(k, +i, t); } });
$("#lb-close").addEventListener("click", lbClose);
$("#lb-prev").addEventListener("click", () => { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; lbShow(); });
$("#lb-next").addEventListener("click", () => { lbIdx = (lbIdx + 1) % lbList.length; lbShow(); });
lb.addEventListener("click", e => { if (e.target === lb) lbClose(); });
addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  e.stopImmediatePropagation();
  if (e.key === "Escape") lbClose();
  if (e.key === "ArrowRight") $("#lb-next").click();
  if (e.key === "ArrowLeft") $("#lb-prev").click();
}, true);

/* ---------- Lien direct (#video, #3d…) ---------- */
function fromHash() { const k = location.hash.slice(1); if (SECTIONS[k]) open(k, true); else if (current) close(); }
addEventListener("hashchange", fromHash);
if (isScroll()) viewport.scrollLeft = (scene.scrollWidth - innerWidth) / 2;
if (location.hash) setTimeout(fromHash, 300);
</script>
</body>
</html>
